backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Products & Samples"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Title", name: "title", widget: "string" }
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }

  - name: "videos"
    label: "How We Work Videos"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Video Title", name: "title", widget: "string" }
      - { label: "Embed URL or Video Link", name: "video_url", widget: "string", help: "e.g., https://www.youtube-nocookie.com/embed/VIDEO_ID or an MP4 upload" }
      - { label: "Description", name: "description", widget: "text" }
