<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iSourceU | Apparel & Custom Sourcing</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #161616;
      --text-color: #f5f5f5;
      --accent-color: #ffffff;
      --subtext: #a0a0a0;
      --border-color: #262626;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      border-bottom: 1px solid var(--border-color);
    }
    .logo {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-decoration: none;
    }
    nav a {
      color: var(--subtext);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.9rem;
    }
    .hero {
      text-align: center;
      padding: 80px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }
    .hero p {
      color: var(--subtext);
      font-size: 1.1rem;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background-color: var(--accent-color);
      color: var(--bg-color);
      text-decoration: none;
      font-weight: 700;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85rem;
    }
    .products {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .products h2 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 6px;
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .card p {
      color: var(--subtext);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .card .price {
      font-weight: 700;
      color: var(--accent-color);
    }
    footer {
      border-top: 1px solid var(--border-color);
      padding: 40px 5%;
      text-align: center;
      color: var(--subtext);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">iSourceU</a>
    <nav>
      <a href="#catalogue">Catalogue</a>
      <a href="/admin/">CMS Admin</a>
    </nav>
  </header>

  <section class="hero">
    <h1>ISOURCEU</h1>
    <p>WEAR RARE. DESIGNED IN AUSTRALIA.</p>
    <a href="/admin/" class="btn">Manage Catalogue</a>
  </section>

  <section class="products" id="catalogue">
    <h2>Core Catalogue</h2>
    <div class="grid" id="product-grid">
      <p style="color: var(--subtext);">Loading catalogue items...</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 iSourceU. All rights reserved. Designed in Australia.</p>
  </footer>

  <script>
    // Fetches live CMS product entries from GitHub repository API
    async function fetchCMSProducts() {
      const grid = document.getElementById('product-grid');
      const repoUrl = 'https://api.github.com/repos/ahsan170483/isourceu-website/contents/content/products';

      try {
        const response = await fetch(repoUrl);
        if (!response.ok) throw new Error('No products directory found yet');
        const files = await response.json();

        grid.innerHTML = ''; // Clear loading state

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const fileRes = await fetch(file.download_url);
            const content = await fileRes.text();
            
            // Extract frontmatter fields (title, price, body/description, image)
            const titleMatch = content.match(/title:\s*["']?(.*?)["']?\n/);
            const priceMatch = content.match(/price:\s*["']?(.*?)["']?\n/);
            const imageMatch = content.match(/image:\s*["']?(.*?)["']?\n/);
            const bodyContent = content.split('---')[2] || '';

            const title = titleMatch ? titleMatch[1] : file.name.replace('.md', '');
            const price = priceMatch ? priceMatch[1] : '';
            const image = imageMatch ? imageMatch[1] : '';

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              ${image ? `<img src="${image}" alt="${title}">` : ''}
              <h3>${title}</h3>
              <p>${bodyContent.trim().substring(0, 100)}</p>
              ${price ? `<div class="price">${price}</div>` : ''}
            `;
            grid.appendChild(card);
          }
        }
      } catch (err) {
        grid.innerHTML = '<p style="color: var(--subtext);">No products added in CMS yet or directory empty.</p>';
      }
    }

    fetchCMSProducts();
  </script>
</body>
</html>
